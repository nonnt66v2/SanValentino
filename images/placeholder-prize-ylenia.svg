<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe0e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffeef8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#roseBg)"/>
  
  <!-- Rose petals -->
  <ellipse cx="300" cy="250" rx="80" ry="90" fill="#ff6b9d" opacity="0.9"/>
  <ellipse cx="250" cy="230" rx="70" ry="80" fill="#ff8cb8" opacity="0.8"/>
  <ellipse cx="350" cy="230" rx="70" ry="80" fill="#ff8cb8" opacity="0.8"/>
  <ellipse cx="270" cy="280" rx="65" ry="75" fill="#ff5a8f" opacity="0.85"/>
  <ellipse cx="330" cy="280" rx="65" ry="75" fill="#ff5a8f" opacity="0.85"/>
  
  <!-- Inner petals -->
  <ellipse cx="300" cy="260" rx="50" ry="60" fill="#ff3d7f" opacity="0.9"/>
  <ellipse cx="285" cy="250" rx="40" ry="50" fill="#ff1f5e" opacity="0.8"/>
  <ellipse cx="315" cy="250" rx="40" ry="50" fill="#ff1f5e" opacity="0.8"/>
  
  <!-- Center of rose -->
  <ellipse cx="300" cy="250" rx="25" ry="30" fill="#c44569"/>
  
  <!-- Stem -->
  <rect x="290" y="330" width="20" height="200" fill="#52c234" rx="10"/>
  
  <!-- Leaves -->
  <ellipse cx="260" cy="400" rx="40" ry="25" fill="#4a9d2a" transform="rotate(-30 260 400)"/>
  <ellipse cx="340" cy="450" rx="40" ry="25" fill="#4a9d2a" transform="rotate(30 340 450)"/>
  
  <!-- Hearts decoration -->
  <path d="M 150 100 Q 150 80 165 80 Q 180 80 180 100 Q 180 120 165 135 Q 150 120 150 100 Z" fill="#ff6b9d" opacity="0.6"/>
  <path d="M 420 100 Q 420 80 435 80 Q 450 80 450 100 Q 450 120 435 135 Q 420 120 420 100 Z" fill="#ff6b9d" opacity="0.6"/>
  <path d="M 500 350 Q 500 330 515 330 Q 530 330 530 350 Q 530 370 515 385 Q 500 370 500 350 Z" fill="#ff6b9d" opacity="0.6"/>
  <path d="M 70 350 Q 70 330 85 330 Q 100 330 100 350 Q 100 370 85 385 Q 70 370 70 350 Z" fill="#ff6b9d" opacity="0.6"/>
  
  <!-- Text -->
  <text x="300" y="560" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#c44569" text-anchor="middle">🌹 Una Rosa 🌹</text>
</svg>
